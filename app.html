<title>BFHI Learn</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: iOS-style app shell — sticky translucent nav, scrolling view, fixed tab bar; inset grouped lists. */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --surface2:#E3EAE6; --ink:#132320; --muted:#5A6B67; --line:#D5DED9;
  --brand:#0E5A52; --brand-ink:#FFFFFF; --soft:#D7ECE6; --warm:#C8603F; --warm-soft:#F7E2D9;
  --good:#23794A; --good-soft:#DCEFE3; --warn:#9A6A12; --warn-soft:#F5EAD2; --bad:#B23A2C; --bad-soft:#F6DEDA;
  --nav:rgba(238,242,239,.82);
  --display: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI Variable Display", system-ui, sans-serif;
  --body: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:16px;
  --tabh:58px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B1312; --surface:#15201E; --surface2:#1D2A28; --ink:#E6EEEB; --muted:#93A5A0; --line:#263431;
  --brand:#5CC0AE; --brand-ink:#04221E; --soft:#163A34; --warm:#EE8D6C; --warm-soft:#3A2219;
  --good:#5DC087; --good-soft:#163022; --warn:#E2B354; --warn-soft:#33290F; --bad:#F0796A; --bad-soft:#3A1A16;
  --nav:rgba(11,19,18,.80); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0B1312; --surface:#15201E; --surface2:#1D2A28; --ink:#E6EEEB; --muted:#93A5A0; --line:#263431;
  --brand:#5CC0AE; --brand-ink:#04221E; --soft:#163A34; --warm:#EE8D6C; --warm-soft:#3A2219;
  --good:#5DC087; --good-soft:#163022; --warn:#E2B354; --warn-soft:#33290F; --bad:#F0796A; --bad-soft:#3A1A16;
  --nav:rgba(11,19,18,.80); color-scheme:dark }

*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.5;margin:0;
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--nav)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:8px}

.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:48px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));
  background:var(--nav);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-bottom:.5px solid transparent;transition:border-color .2s}
.nav.scrolled{border-bottom-color:var(--line)}
.nav .t{font-weight:650;font-size:1.0625rem;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.nav.scrolled .t,.nav.solid .t{opacity:1}
.nav .l{justify-self:start}.nav .r{justify-self:end}
.navbtn{background:none;border:0;color:var(--brand);font-size:1.0625rem;display:flex;align-items:center;gap:2px;min-height:44px;padding:0 8px}
.navbtn svg{width:22px;height:22px}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:4px calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 28px);max-width:720px;margin:0 auto}
.lt{font-family:var(--display);font-weight:800;font-size:2.125rem;letter-spacing:-.01em;line-height:1.1;margin:4px 0 14px;text-wrap:balance}
.sub{color:var(--muted);margin:-8px 0 16px}
h2.sh{font-size:.8125rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:24px 4px 8px}
.sh-desc{color:var(--muted);font-size:.875rem;margin:-4px 4px 8px}

/* grouped list */
.group{background:var(--surface);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:11px 14px;min-height:56px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:60px;right:0;border-top:.5px solid var(--line)}
.row:active{background:var(--surface2)}
.row .tx{flex:1;min-width:0}
.row .tt{font-weight:600;display:block}
.row .ts{color:var(--muted);font-size:.875rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:8px;height:14px;color:var(--muted);flex:none;opacity:.7}
.badge{flex:none;width:34px;height:34px;border-radius:10px;background:var(--soft);color:var(--brand);display:grid;place-items:center;
  font-family:var(--display);font-weight:800;font-size:.8125rem;letter-spacing:-.01em}
.badge.done{background:var(--brand);color:var(--brand-ink)}
.meter{width:42px;height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;flex:none}
.meter i{display:block;height:100%;background:var(--brand);border-radius:3px}

/* cards */
.card{background:var(--surface);border-radius:var(--r);padding:16px}
.stack{display:grid;gap:12px}
.hero{background:var(--brand);color:var(--brand-ink);border-radius:20px;padding:18px;display:flex;gap:16px;align-items:center}
.hero .k{font-family:var(--display);font-weight:800;font-size:1.25rem;line-height:1.2}
.hero .m{opacity:.85;font-size:.875rem}
.hero .btn{background:var(--brand-ink);color:var(--brand);margin-top:10px}
.ring{flex:none;width:84px;height:84px}
.ring text{font-family:var(--display);font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border:0;border-radius:var(--r);padding:14px;text-align:left;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.tile:active{transform:scale(.98)}
.tile svg{width:26px;height:26px;color:var(--brand)}
.tile b{font-size:.9375rem;line-height:1.25}
.tile span{color:var(--muted);font-size:.8125rem}
.fact{background:var(--warm-soft);border-radius:var(--r);padding:14px 16px}
.fact .e{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--warm);font-weight:700}
.fact b{display:block;font-family:var(--display);font-size:1.125rem;margin:2px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;min-height:46px;font-weight:650;background:var(--brand);color:var(--brand-ink)}
.btn.sec{background:var(--soft);color:var(--brand)}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.block{width:100%}
.btn:active{opacity:.85}
.btn[disabled]{opacity:.4}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.row-btns .btn{flex:1 1 140px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* search */
.search{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:12px;padding:0 12px;margin-bottom:6px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0;background:none;flex:1;min-width:0;padding:10px 0;font-size:1rem;outline:none}
mark{background:var(--warm-soft);color:inherit;border-radius:3px;padding:0 1px}

/* lesson */
.lhead{display:flex;gap:14px;align-items:center;margin:6px 0 16px}
.lhead .badge{width:56px;height:56px;border-radius:16px;font-size:1.125rem}
.lhead h1{font-family:var(--display);font-weight:800;font-size:1.75rem;line-height:1.15;margin:0;text-wrap:balance}
.lhead p{margin:2px 0 0;color:var(--muted)}
.prose{background:var(--surface);border-radius:var(--r);padding:4px 18px 8px}
.prose p,.prose li,.prose dd{max-width:65ch}
.prose ul,.prose ol{padding-left:1.25rem}
.prose li{margin:4px 0}
.prose li::marker{color:var(--brand)}
.prose a{font-weight:600;text-decoration:none;border-bottom:1.5px solid var(--soft)}
.callout{background:var(--soft);border-radius:12px;padding:12px 14px;margin:14px 0}
.callout.warm{background:var(--warm-soft)}
.figure{margin:0 0 12px;border-radius:var(--r);overflow:hidden;background:var(--surface);border:0;padding:0;display:block;width:100%}
.figure img{display:block;width:100%;height:auto}
.figure .cap{display:block;font-size:.75rem;color:var(--muted);padding:6px 12px 8px;text-align:left}
.checks{list-style:none;padding:0;margin:0}
.checks li{display:flex;gap:10px;padding:8px 0;align-items:flex-start}
.checks li+li{border-top:.5px solid var(--line)}
.checks svg{width:20px;height:20px;color:var(--brand);flex:none;margin-top:2px}
.say{background:var(--surface);border-radius:var(--r);padding:14px 16px;border-left:4px solid var(--warm)}
.say .e{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--warm);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.say p{margin:6px 0 0;font-size:1.0625rem}
.linkbtn{background:none;border:0;color:var(--brand);font-weight:650;padding:6px 0;min-height:36px}
.tbl-wrap{overflow-x:auto;margin:10px 0;-webkit-overflow-scrolling:touch}
.tbl{border-collapse:collapse;width:100%;font-size:.875rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px;text-align:left;border-bottom:.5px solid var(--line);vertical-align:top}
.tbl th{color:var(--muted);font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em}
.tbl td.e{color:var(--brand);font-weight:650}
.cue-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.cue{border-radius:12px;padding:10px;font-size:.8125rem;min-width:0}
.cue b{display:block;font-size:.9375rem}
.cue span{display:block;font-style:italic;opacity:.8;margin-bottom:4px}
.cue ul{padding-left:1rem;margin:0}
.cue.early{background:var(--good-soft)}.cue.mid{background:var(--warn-soft)}.cue.late{background:var(--bad-soft)}
.myths dt{font-weight:650;margin-top:14px;position:relative;padding-left:26px}
.myths dt::before{content:"✕";position:absolute;left:0;top:0;color:var(--bad);font-weight:800}
.myths dd{margin:4px 0 0 26px;color:var(--ink);position:relative}
.swipehint{text-align:center;color:var(--muted);font-size:.75rem;margin-top:14px}

/* quiz */
.qtop{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.bar{flex:1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:3px;transition:width .3s}
.qcount{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.875rem;font-weight:600}
.qtext{font-family:var(--display);font-weight:700;font-size:1.375rem;line-height:1.3;margin:6px 0 18px;text-wrap:pretty}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:2px solid transparent;border-radius:14px;padding:14px;min-height:56px;font-size:1rem;transition:background .15s,border-color .15s}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-size:.8125rem}
.opt:active{transform:scale(.99)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt[disabled]{cursor:default}
.feedback{margin-top:14px;border-radius:14px;padding:14px 16px;animation:rise .25s ease}
.feedback.good{background:var(--good-soft)}.feedback.bad{background:var(--bad-soft)}
.feedback b{display:block;margin-bottom:2px}
@keyframes rise{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.score{font-family:var(--display);font-weight:800;font-size:3.5rem;line-height:1;font-variant-numeric:tabular-nums}
.bars{display:grid;gap:8px}
.bars .bl{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:10px;font-size:.875rem;font-variant-numeric:tabular-nums}
.bars .bl b{font-family:var(--display)}
.boxes{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface2);margin:10px 0 6px}
.boxes i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;background:var(--c)}

/* segmented */
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 8px;font-size:.875rem;font-weight:600;min-height:36px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* flashcards */
.fc-stage{position:relative;height:min(62vh,440px);margin:6px 0 16px;perspective:1200px}
.fc{position:absolute;inset:0;border:0;padding:0;background:none;touch-action:pan-y;transition:transform .35s ease}
.fc .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.3,1)}
.fc.flipped .in{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;background:var(--surface);padding:22px;
  display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:left;box-shadow:0 10px 30px rgba(10,40,35,.10);overflow:auto}
.fc .back{transform:rotateY(180deg);background:var(--soft)}
.fc .face .e{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--warm)}
.fc .face p{margin:0;font-size:1.1875rem;line-height:1.4}
.fc .face.front p{font-family:var(--display);font-weight:700;font-size:1.375rem}
.fc .hint{position:absolute;bottom:14px;left:22px;right:22px;color:var(--muted);font-size:.8125rem}
.fc-tag{position:absolute;top:18px;padding:4px 10px;border-radius:8px;font-weight:800;font-size:.875rem;opacity:0;z-index:2}
.fc-tag.yes{right:18px;background:var(--good);color:var(--surface)}
.fc-tag.no{left:18px;background:var(--bad);color:var(--surface)}

/* forms */
.field{display:grid;gap:6px}
.field label,.flabel{font-size:.8125rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
input[type="datetime-local"],select{width:100%;font-size:1rem;padding:12px;border-radius:12px;border:0;background:var(--surface);min-height:48px;-webkit-appearance:none;appearance:none}
.radio-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:12px 14px;min-height:50px;position:relative}
.radio-row+.radio-row::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:.5px solid var(--line)}
.radio-row .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.radio-row[aria-checked="true"] .dot{border-color:var(--brand)}
.radio-row[aria-checked="true"] .dot::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--brand)}
.radio-row .tx{flex:1}
.radio-row .rt{color:var(--muted);font-size:.875rem;font-variant-numeric:tabular-nums}
.radio-row[aria-disabled="true"]{opacity:.45}
.label-card{background:var(--surface);border-radius:20px;padding:18px;border:2px dashed var(--brand)}
.label-card .big{font-family:var(--display);font-weight:800;font-size:1.75rem;line-height:1.15;font-variant-numeric:tabular-nums}
.label-card .lbl{font-family:var(--mono);font-size:1.0625rem;background:var(--surface2);border-radius:10px;padding:10px 12px;margin:10px 0;word-break:break-word;font-variant-numeric:tabular-nums}
.label-card.no{border-color:var(--bad)}

/* audit */
.aud{padding:12px 14px;display:grid;gap:8px;position:relative}
.aud+.aud::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:.5px solid var(--line)}
.aud .seg button[aria-pressed="true"].y{background:var(--good);color:var(--surface)}
.aud .seg button[aria-pressed="true"].p{background:var(--warn);color:var(--surface)}
.aud .seg button[aria-pressed="true"].n{background:var(--bad);color:var(--surface)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;justify-content:space-around;
  padding:6px max(8px,env(safe-area-inset-left,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px));
  background:var(--nav);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-top:.5px solid var(--line)}
.tab{flex:1;max-width:120px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.6875rem;font-weight:600;color:var(--muted);min-height:48px;padding:2px 0;position:relative}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--brand)}
.tab .dotn{position:absolute;top:0;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--warm);color:#fff;font-size:.6875rem;display:grid;place-items:center;padding:0 5px}

.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 18px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-weight:600;font-size:.9375rem;opacity:0;pointer-events:none;transition:all .25s;z-index:40;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 56px) max(8px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(8px,env(safe-area-inset-left,0px));overflow:auto;touch-action:pinch-zoom}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.lightbox button{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(12px,env(safe-area-inset-right,0px));background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:20px;padding:8px 14px;font-weight:650}
.install{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:var(--r);padding:14px}
.install svg{width:24px;height:24px;color:var(--brand);flex:none}
.install p{margin:0;font-size:.875rem}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.view-enter{animation:viewin .22s ease}
@keyframes viewin{from{opacity:.3;transform:translateX(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.cue-grid{grid-template-columns:1fr}.lt{font-size:1.875rem}}
</style>

<header class="nav" id="nav">
  <div class="l" id="navL"></div>
  <div class="t" id="navT">BFHI Learn</div>
  <div class="r" id="navR"></div>
</header>
<main id="view" aria-live="polite"></main>
<nav class="tabbar" id="tabbar" aria-label="Sections">
  <button class="tab" data-tab="home" id="tab-home"></button>
  <button class="tab" data-tab="learn" id="tab-learn"></button>
  <button class="tab" data-tab="practice" id="tab-practice"></button>
  <button class="tab" data-tab="tools" id="tab-tools"></button>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';
/* ---------- utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const strip = h => h.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const DAY = 864e5;
const todayKey = (d = new Date()) => d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
const L = Object.fromEntries(LESSONS.map(l => [l.id, l]));

/* ---------- storage ---------- */
const KEY = 'bfhi-learn-v1';
const DEF = { read: {}, srs: {}, audit: {}, mocks: [], streak: { d: '', n: 0 }, fs: 1, noInstall: false, ebm: { type: 'healthy', loc: 'fridge' } };
let S;
try { S = Object.assign({}, DEF, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { S = JSON.parse(JSON.stringify(DEF)); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function touchStreak() {
  const t = todayKey(), y = todayKey(new Date(Date.now() - DAY));
  if (S.streak.d === t) return;
  S.streak = { d: t, n: S.streak.d === y ? S.streak.n + 1 : 1 }; save();
}
function streakNow() { const t = todayKey(), y = todayKey(new Date(Date.now() - DAY)); return (S.streak.d === t || S.streak.d === y) ? S.streak.n : 0; }

/* ---------- spaced repetition (Leitner) ---------- */
const INTERVAL = [0, 10 * 60e3, 1 * DAY, 3 * DAY, 7 * DAY, 21 * DAY];
function grade(qid, ok) {
  const r = S.srs[qid] || { b: 0, d: 0, n: 0, c: 0 };
  r.n++; if (ok) r.c++;
  r.b = ok ? Math.min(5, Math.max(1, r.b) + 1) : 1;
  if (ok && r.n === 1) r.b = 3; /* knew it cold on first sight */
  r.d = Date.now() + INTERVAL[r.b];
  S.srs[qid] = r; touchStreak(); save();
}
const dueList = () => QUESTIONS.filter(q => S.srs[q.id] && S.srs[q.id].d <= Date.now());
const unseen = () => QUESTIONS.filter(q => !S.srs[q.id]);
function mastery(step) {
  const qs = QUESTIONS.filter(q => q.step === step); if (!qs.length) return 0;
  return qs.reduce((a, q) => a + ((S.srs[q.id] || { b: 0 }).b / 5), 0) / qs.length;
}
function smartQueue(n = 10) {
  const due = dueList().sort((a, b) => S.srs[a.id].b - S.srs[b.id].b || S.srs[a.id].d - S.srs[b.id].d);
  const un = unseen().sort((a, b) => (S.read[b.step] ? 1 : 0) - (S.read[a.step] ? 1 : 0));
  return due.concat(un).slice(0, n);
}
function nextDueIn() {
  const ds = QUESTIONS.map(q => S.srs[q.id]).filter(Boolean).map(r => r.d).filter(d => d > Date.now());
  if (!ds.length) return '';
  const ms = Math.min(...ds) - Date.now();
  if (ms < 3600e3) return Math.max(1, Math.round(ms / 60e3)) + ' min';
  if (ms < DAY) return Math.round(ms / 3600e3) + ' h';
  return Math.round(ms / DAY) + ' day' + (Math.round(ms / DAY) > 1 ? 's' : '');
}

/* ---------- navigation ---------- */
let tab = 'home';
const stacks = { home: [['home']], learn: [['learn']], practice: [['practice']], tools: [['tools']] };
const scrollMem = {};
const cur = () => stacks[tab][stacks[tab].length - 1];
function go(view, ...args) {
  scrollMem[tab + stacks[tab].length] = window.scrollY;
  stacks[tab].push([view, ...args]);
  try { history.pushState({ n: stacks[tab].length }, ''); } catch (e) {}
  render(true); window.scrollTo(0, 0);
}
function replace(view, ...args) { stacks[tab][stacks[tab].length - 1] = [view, ...args]; render(true); window.scrollTo(0, 0); }
function back() {
  if (stacks[tab].length > 1) { stacks[tab].pop(); render(); window.scrollTo(0, scrollMem[tab + stacks[tab].length] || 0); }
}
function switchTab(t) {
  if (t === tab) { if (stacks[t].length > 1) { stacks[t] = [stacks[t][0]]; render(); window.scrollTo(0, 0); } else window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  scrollMem['tab-' + tab] = window.scrollY; tab = t; render(); window.scrollTo(0, scrollMem['tab-' + t] || 0);
}
window.addEventListener('popstate', () => { if (stacks[tab].length > 1) back(); });

function setNav(title, opts = {}) {
  $('#navT').textContent = title;
  const depth = stacks[tab].length;
  $('#navL').innerHTML = depth > 1 ? `<button class="navbtn" id="navBack" aria-label="Back">${ICON.back}<span>${esc(opts.backLabel || 'Back')}</span></button>` : '';
  $('#navR').innerHTML = opts.right || '';
  $('#nav').classList.toggle('solid', !!opts.solid);
  const b = $('#navBack'); if (b) b.onclick = back;
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 1800); }
function copyText(text) {
  const done = () => toast('Copied');
  try { navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text)); } catch (e) { fallbackCopy(text); }
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('Copied'); } catch (e) { toast('Select and copy the text'); } ta.remove();
}

/* ---------- render ---------- */
const VIEWS = {};
function render(anim) {
  const [v, ...args] = cur();
  $$('.tab').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  const due = dueList().length; const pb = $('#tab-practice .dotn');
  if (due && !pb) $('#tab-practice').insertAdjacentHTML('beforeend', `<span class="dotn">${due}</span>`); else if (pb) { if (due) pb.textContent = due; else pb.remove(); }
  const out = VIEWS[v](...args);
  const view = $('#view'); view.innerHTML = out.html; view.classList.remove('view-enter');
  if (anim) { void view.offsetWidth; view.classList.add('view-enter'); }
  setNav(out.title, out);
  $$('[data-go]', view).forEach(a => a.addEventListener('click', e => { e.preventDefault(); const g = a.dataset.go; if (g.startsWith('tool:')) { tab = 'tools'; stacks.tools = [['tools'], [g.slice(5)]]; render(true); window.scrollTo(0, 0); } else go('lesson', g); }));
  $$('img[data-zoom]', view).forEach(i => i.closest('button').addEventListener('click', () => lightbox(i.src, i.alt)));
  out.after && out.after(view);
  onScroll();
}
function onScroll() { $('#nav').classList.toggle('scrolled', window.scrollY > 30); }
window.addEventListener('scroll', onScroll, { passive: true });

function lightbox(src, alt) {
  const d = document.createElement('div'); d.className = 'lightbox'; d.setAttribute('role', 'dialog');
  d.innerHTML = `<img src="${src}" alt="${esc(alt)}"><button type="button">Done</button>`;
  d.querySelector('button').onclick = () => d.remove(); document.body.appendChild(d);
}
function ring(p, size = 84, label) {
  const r = 34, c = 2 * Math.PI * r, off = c * (1 - p);
  return `<svg class="ring" viewBox="0 0 84 84" width="${size}" height="${size}" aria-hidden="true">
  <circle cx="42" cy="42" r="${r}" fill="none" stroke="currentColor" stroke-opacity=".22" stroke-width="8"/>
  <circle cx="42" cy="42" r="${r}" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 42 42)"/>
  <text x="42" y="48" text-anchor="middle" font-size="19" fill="currentColor">${label}</text></svg>`;
}
function listRow({ go: g, badge, done, title, sub, right, attr = '' }) {
  return `<button class="row" ${g ? `data-nav="${g}"` : ''} ${attr}>${badge !== undefined ? `<span class="badge ${done ? 'done' : ''}">${badge}</span>` : ''}
  <span class="tx"><span class="tt">${title}</span>${sub ? `<span class="ts">${sub}</span>` : ''}</span>${right || ''}${ICON.chev}</button>`;
}
function bindNav(view) { $$('[data-nav]', view).forEach(b => b.addEventListener('click', () => { const [v, ...a] = b.dataset.nav.split('|'); go(v, ...a); })); }
const nextUnread = () => LESSONS.find(l => !S.read[l.id]);
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
let topLevel = true; try { topLevel = window.self === window.top; } catch (e) { topLevel = false; }

/* ---------- LEARN ---------- */
let searchQ = '';
VIEWS.learn = () => {
  const lessonRows = sec => LESSONS.filter(l => l.sec === sec).map(l => listRow({ go: 'lesson|' + l.id, badge: l.badge, done: S.read[l.id], title: esc(l.title), sub: esc(l.short) })).join('');
  return { title: 'Learn', html: `
  <h1 class="lt" style="margin-top:12px">Learn</h1>
  <div class="search">${ICON.search}<input id="q" type="search" placeholder="Search lessons, e.g. skin-to-skin" value="${esc(searchQ)}" autocomplete="off" enterkeyhint="search" aria-label="Search lessons"></div>
  <div id="results"></div>
  <div id="secs">${SECTIONS.map(s => `<h2 class="sh">${esc(s.title)}</h2><p class="sh-desc">${esc(s.sub)}</p><div class="group">${lessonRows(s.id)}</div>`).join('')}</div>`,
  after(v) {

      searchQ = q.value.trim(); const t = searchQ.toLowerCase();

      secs.hidden = true;
      const hits = LESSONS.map(l => { const txt = strip(l.title + ' ' + l.short + ' ' + l.body + ' ' + (l.checks || []).join(' ')); const i = txt.toLowerCase().indexOf(t); return i < 0 ? null : { l, i, txt }; }).filter(Boolean);
      const qh = QUESTIONS.filter(x => (x.q + ' ' + x.w).toLowerCase().includes(t)).length;
      const hl = s => esc(s).replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<mark>${m}</mark>`);
      res.innerHTML = hits.length ? `<h2 class="sh">${hits.length} lesson${hits.length > 1 ? 's' : ''}</h2><div class="group">${hits.map(h => {
        const s = Math.max(0, h.i - 30); const snip = (s ? '…' : '') + h.txt.slice(s, h.i + t.length + 60) + '…';

  } };
};

  ${l.bm ? `<h2 class="sh">Say it to mothers</h2><div class="say"><span class="e">Bahasa Malaysia <button class="linkbtn" id="cpy" style="min-height:0;padding:0;display:inline-flex;gap:4px;align-items:center">${ICON.copy}Copy</button></span><p lang="ms">${esc(l.bm)}</p></div>` : ''}

      sx = null;
    }, { passive: true });
  } };
};

/* quiz engine */
let Q = null;
function startQuiz(mode, arg) {
  let items;
  if (mode === 'smart') { items = smartQueue(10); if (!items.length) items = shuffle(QUESTIONS).sort((a, b) => (S.srs[a.id] || {}).b - (S.srs[b.id] || {}).b).slice(0, 10); }
  else if (mode === 'topic') items = shuffle(QUESTIONS.filter(q => q.step === arg));
  else if (mode === 'mock') {
    const per = STEP_IDS.map(s => shuffle(QUESTIONS.filter(q => q.step === s))[0]).filter(Boolean);
    const rest = shuffle(QUESTIONS.filter(q => !per.includes(q))).slice(0, 20 - per.length);
    items = shuffle(per.concat(rest));
  } else if (mode === 'retry') items = arg;
  Q = { mode, arg, items: items.map(q => ({ q, order: shuffle(q.o.map((_, i) => i)) })), i: 0, ans: [], answered: false };
}
VIEWS.quiz = (mode, arg) => {
  if (!Q || Q.mode !== mode || Q.arg !== arg || Q.done) startQuiz(mode, arg);
  if (Q.answered) { Q.answered = false; Q.i++; if (Q.i >= Q.items.length) { Q.done = true; finishQuiz(); return VIEWS.result(); } }
  const it = Q.items[Q.i]; if (!it) return VIEWS.result();
  const q = it.q; const L0 = L[q.step];
  const title = mode === 'smart' ? 'Smart review' : mode === 'mock' ? 'Mock assessment' : mode === 'retry' ? 'Retry mistakes' : L0.title;
  return { title, backLabel: 'End', solid: true, html: `
  <div class="qtop"><div class="bar"><i style="width:${Q.i / Q.items.length * 100}%"></i></div><span class="qcount">${Q.i + 1}/${Q.items.length}</span></div>
  <span class="pill">${esc(L0.badge)} · ${esc(L0.title)}</span>
  <p class="qtext">${esc(q.q)}</p>
  <div class="opts" role="group" aria-label="Answers">${it.order.map((oi, k) => `<button class="opt" data-oi="${oi}"><span class="k">${'ABCD'[k]}</span><span>${esc(q.o[oi])}</span></button>`).join('')}</div>
  <div id="fb"></div>`,
  after(v) {
    $$('.opt', v).forEach(b => b.onclick = () => {
      if (Q.answered) return; Q.answered = true;
      const oi = +b.dataset.oi, ok = oi === q.a;
      $$('.opt', v).forEach(x => { x.disabled = true; if (+x.dataset.oi === q.a) x.classList.add('right'); });
      if (!ok) b.classList.add('wrong');
      grade(q.id, ok); Q.ans.push({ q, ok });
      if (navigator.vibrate) try { navigator.vibrate(ok ? 15 : [30, 40, 30]); } catch (e) {}
      const last = Q.i === Q.items.length - 1;
      $('#fb').innerHTML = `<div class="feedback ${ok ? 'good' : 'bad'}"><b>${ok ? 'Correct' : 'Not quite'}</b>${esc(q.w)}
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px"><button class="linkbtn" data-go="${q.step}">Read the lesson</button><button class="btn" id="nextQ">${last ? 'See results' : 'Next'}</button></div></div>`;
      $('[data-go]', $('#fb')).onclick = () => go('lesson', q.step);
      $('#nextQ').onclick = () => { Q.i++; Q.answered = false; if (Q.i >= Q.items.length) { Q.done = true; finishQuiz(); } render(true); window.scrollTo(0, 0); };
      $('#nextQ').focus({ preventScroll: true });
      setTimeout(() => $('#fb').scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
    });
  } };
};
function finishQuiz() {
  const s = Math.round(Q.ans.filter(a => a.ok).length / Q.ans.length * 100);
  if (Q.mode === 'mock') { S.mocks.push({ t: Date.now(), s }); S.mocks = S.mocks.slice(-20); save(); }

}
VIEWS.result = () => {

/* EBM label calculator */
function addRule(d, r) {
  const o = new Date(d.getTime());
  if (r.h) return new Date(o.getTime() + r.h * 3600e3);
  if (r.d) { o.setDate(o.getDate() + r.d - 1); return o; }
  if (r.m) { const day = o.getDate(); o.setDate(1); o.setMonth(o.getMonth() + r.m); const last = new Date(o.getFullYear(), o.getMonth() + 1, 0).getDate(); o.setDate(Math.min(day, last)); return o; }
}
const dmy = d => d.getDate() + '/' + (d.getMonth() + 1) + '/' + d.getFullYear();
function bmTime(d) {
  const h = d.getHours(), m = d.getMinutes(); const h12 = h % 12 === 0 ? 12 : h % 12;
  const part = h < 12 ? 'pagi' : h < 14 ? 'tengah hari' : h < 19 ? 'petang' : 'malam';
  return h12 + (m ? ':' + String(m).padStart(2, '0') : '') + ' ' + part;
}
const ruleText = r => !r ? 'Not recommended' : r.h ? r.h + ' h' : r.d ? (r.d === 7 ? '<8 days' : r.d === 14 ? '2 weeks' : r.d + ' days') : r.m + ' months';
function localISO(d) { const p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()); }

    <div class="field"><label for="when">${loc === 'thaw' ? 'Moved to fridge to thaw' : 'Expressed on'}</label><input type="datetime-local" id="when" value="${ebmWhen}"></div>

    <p class="muted small" style="margin:0">Times follow the KKM / JKN Sarawak guide. Day-based limits count the day of expression as day 1, matching the KKM label example. Warmed milk: use within 1 hour. Never microwave.</p>
  </div>`,

    const r = $('#rst'); if (r) r.onclick = () => { confirmReset = true; const y = window.scrollY; render(); window.scrollTo(0, y); };
    const rn = $('#rNo'); if (rn) rn.onclick = () => { confirmReset = false; render(); };
    const ry = $('#rYes'); if (ry) ry.onclick = () => { S.audit = {}; confirmReset = false; save(); toast('Ratings cleared'); render(); window.scrollTo(0, 0); };
  } };
};

/* settings & about */
let confirmWipe = false;
VIEWS.settings = () => ({ title: 'Settings', backLabel: 'Tools', html: `
  <h1 class="lt" style="margin-top:12px">Settings</h1>
  <div class="field"><span class="flabel">Text size</span><div class="seg" role="group" aria-label="Text size">${[[.9, 'Small'], [1, 'Default'], [1.1, 'Large'], [1.2, 'Larger']].map(([f, n]) => `<button aria-pressed="${S.fs === f}" data-fs="${f}">${n}</button>`).join('')}</div></div>
  <h2 class="sh">Progress</h2>
  <div class="card stack">
    <p style="margin:0" class="small">${Object.keys(S.read).length} lessons read · ${Object.keys(S.srs).length} questions attempted · ${S.mocks.length} mock assessments</p>
    ${confirmWipe ? `<p style="margin:0"><b>Reset everything?</b> Lessons, review schedule, mock scores and audit ratings will be cleared.</p><div class="row-btns"><button class="btn ghost" id="wNo">Cancel</button><button class="btn" style="background:var(--bad);color:var(--surface)" id="wYes">Reset</button></div>` : `<button class="btn ghost block" id="wipe">Reset all progress</button>`}
  </div>`,
  after(v) {
    $$('[data-fs]', v).forEach(b => b.onclick = () => { S.fs = +b.dataset.fs; save(); applyFs(); render(); });
    const w = $('#wipe'); if (w) w.onclick = () => { confirmWipe = true; render(); };
    const n = $('#wNo'); if (n) n.onclick = () => { confirmWipe = false; render(); };
    const y = $('#wYes'); if (y) y.onclick = () => { S = Object.assign(JSON.parse(JSON.stringify(DEF)), { fs: S.fs, noInstall: S.noInstall }); confirmWipe = false; save(); toast('Progress reset'); render(); };
  } });
VIEWS.about = () => {
  const off = 'serviceWorker' in navigator && navigator.serviceWorker.controller;
  return { title: 'About', backLabel: 'Tools', html: `
  <h1 class="lt" style="margin-top:12px">About</h1>
  <div class="card stack">
    <p style="margin:0"><span class="pill ${off ? 'good' : 'warn'}">${off ? 'Available offline' : 'Offline mode not active here'}</span></p>
    <p style="margin:0">BFHI Learn is a self-study companion for staff preparing for Baby-friendly Hospital Initiative (Hospital Rakan Bayi) assessment, including NICU and SCN teams.</p>
    <p style="margin:0" class="small muted">Progress is stored only on this device. No data leaves your phone.</p>
  </div>
  <h2 class="sh">Sources</h2>
  <div class="card"><ul class="checks small">
    <li>${ICON.check}<span>WHO & UNICEF. Implementation guidance: protecting, promoting and supporting breastfeeding in facilities providing maternity and newborn services — the revised Baby-friendly Hospital Initiative. 2018.</span></li>
    <li>${ICON.check}<span>WHO & UNICEF. Acceptable medical reasons for use of breast-milk substitutes. 2009.</span></li>
    <li>${ICON.check}<span>WHO. International Code of Marketing of Breast-milk Substitutes. 1981, and subsequent WHA resolutions.</span></li>
    <li>${ICON.check}<span>Nyqvist KH, et al. Neo-BFHI: The Baby-friendly Hospital Initiative for Neonatal Wards. Core document. 2015.</span></li>
    <li>${ICON.check}<span>Kementerian Kesihatan Malaysia. Manual Pembimbing Penyusuan Susu Ibu. 2019.</span></li>
    <li>${ICON.check}<span>Jabatan Kesihatan Negeri Sarawak, Cawangan Pemakanan. Penyusuan Susu Ibu Pilihan Terbaik Anda (booklet).</span></li>
    <li>${ICON.check}<span>National Lactation Centre, KKM. Infographics on positioning and attachment.</span></li>
  </ul></div>
  <p class="muted small" style="margin:14px 4px">For education only. Follow your hospital policy and national guidelines for clinical decisions.</p>`, after() {} };
};

/* ---------- boot ---------- */
function applyFs() { document.documentElement.style.fontSize = (16 * (S.fs || 1)) + 'px'; }
$$('.tab').forEach(b => { const t = b.dataset.tab; b.innerHTML = ICON[t] + `<span>${{ home: 'Home', learn: 'Learn', practice: 'Practice', tools: 'Tools' }[t]}</span>`; b.onclick = () => switchTab(t); });
applyFs();
const h = (location.hash || '').slice(1);
if (stacks[h]) tab = h;
render();
if ('serviceWorker' in navigator && topLevel && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
}
})();
</script>
