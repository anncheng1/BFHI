function auditScore() {
  let total = 0, n = 0, pts = 0; const per = {};
  AUDIT.forEach(g => { let gp = 0, gn = 0; g.items.forEach((_, i) => { total++; const v = S.audit[g.step + i]; if (v !== undefined) { n++; gn++; gp += v; pts += v; } }); per[g.step] = gn ? gp / (gn * 2) : null; });
  return { total, n, pct: n ? Math.round(pts / (n * 2) * 100) : 0, per };
}
let confirmReset = false;
VIEWS.audit = () => {
  const a = auditScore();
  const weakest = Object.entries(a.per).filter(([, v]) => v !== null && v < 1).sort((x, y) => x[1] - y[1]).slice(0, 3);
  return { title: 'Ward self-audit', backLabel: 'Tools', html: `
  <h1 class="lt" style="margin-top:12px">Ward self-audit</h1>
  <p class="sub" style="margin-top:-6px">Rate what you see on your ward today. Saved on this phone only.</p>
  <div class="card" style="display:flex;gap:16px;align-items:center;color:var(--brand)">
    ${ring(a.pct / 100, 76, a.pct + '%')}
    <div style="color:var(--ink);min-width:0"><b>${a.n} of ${a.total} items rated</b><p class="small muted" style="margin:2px 0 0">${weakest.length ? 'Focus on: ' + weakest.map(([k]) => 'Step ' + L[k].badge).join(', ') : a.n ? 'No gaps in rated items' : 'Yes = 2, Partly = 1, No = 0'}</p></div>
  </div>
  ${AUDIT.map(g => { const p = a.per[g.step]; return `<h2 class="sh" style="display:flex;justify-content:space-between;align-items:center"><span>Step ${esc(L[g.step].badge)} · ${esc(L[g.step].title)}</span>${p !== null ? `<span class="pill ${p >= .8 ? 'good' : p >= .5 ? 'warn' : 'bad'}">${Math.round(p * 100)}%</span>` : ''}</h2>
    <div class="group">${g.items.map((t, i) => { const v = S.audit[g.step + i]; return `<div class="aud"><span>${esc(t)}</span><div class="seg" role="group" aria-label="${esc(t)}">
      <button class="y" aria-pressed="${v === 2}" data-a="${g.step + i}" data-v="2">Yes</button><button class="p" aria-pressed="${v === 1}" data-a="${g.step + i}" data-v="1">Partly</button><button class="n" aria-pressed="${v === 0}" data-a="${g.step + i}" data-v="0">No</button></div></div>`; }).join('')}</div>`; }).join('')}
  <div style="margin-top:22px">${confirmReset ? `<div class="card"><p style="margin:0 0 10px"><b>Clear all audit ratings?</b></p><div class="row-btns"><button class="btn ghost" id="rNo">Keep</button><button class="btn" style="background:var(--bad);color:var(--surface)" id="rYes">Clear</button></div></div>` : `<button class="btn ghost block" id="rst">Clear ratings</button>`}</div>`,
  after(v) {
    $$('[data-a]', v).forEach(b => b.onclick = () => { const k = b.dataset.a, val = +b.dataset.v; if (S.audit[k] === val) delete S.audit[k]; else S.audit[k] = val; save(); const y = window.scrollY; render(); window.scrollTo(0, y); });
    const r = $('#rst'); if (r) r.onclick = () => { confirmReset = true; const y = window.scrollY; render(); window.scrollTo(0, y); };
    const rn = $('#rNo'); if (rn) rn.onclick = () => { confirmReset = false; render(); };
    const ry = $('#rYes'); if (ry) ry.onclick = () => { S.audit = {}; confirmReset = false; save(); toast('Ratings cleared'); render(); window.scrollTo(0, 0); };
  } };
};

/* settings & about */
let confirmWipe = false;
VIEWS.settings = () => ({ title: 'Settings', backLabel: 'Tools', html: `
  <h1 class="lt" style="margin-top:12px">Settings</h1>
  <div class="field"><span class="flabel">Text size</span><div class="seg" role="group" aria-label="Text size">${[[.9, 'Small'], [1, 'Default'], [1.1, 'Large'], [1.2, 'Larger']].map(([f, n]) => `<button aria-pressed="${S.fs === f}" data-fs="${f}">${n}</button>`).join('')}</div></div>
  <h2 class="sh">AI answers</h2>
  <div class="card stack">
    <p style="margin:0"><span class="pill ${aiMode() === 'claude' || aiMode() === 'key' ? 'good' : ''}">${aiMode() === 'claude' ? 'Using your Claude account' : aiMode() === 'key' ? 'On · ' + esc(provLabel()) : aiMode() === 'builtin' ? 'On · ' + esc(builtinLabel()) : aiMode() === 'offline' ? 'Key saved · offline now' : 'Off · lesson search only'}</span></p>
    ${SAMPLE ? '<p class="small muted" style="margin:0">Inside Claude, Ask uses your Claude account. The options below are for the installed app.</p>' : `<p class="small" style="margin:0"><b>No setup needed.</b> Ask uses ${CONFIG.builtinUrl ? 'the hospital’s built-in AI' : 'a free public AI service (best effort)'} automatically. Adding your own key below is optional, for faster and more reliable answers.</p>`}
    <div class="field"><span class="flabel">Provider</span><div class="provs" role="radiogroup" aria-label="AI provider">${Object.entries(PROVIDERS).map(([k, p]) => `<button class="prov" role="radio" aria-checked="${curProv() === k}" data-prov="${k}"><b>${esc(p.name)}</b><span class="pill ${p.free ? 'good' : ''}">${esc(p.tag)}</span></button>`).join('')}</div></div>
    <p class="small" style="margin:0">${esc(PROVIDERS[curProv()].steps)} <a href="${PROVIDERS[curProv()].keyUrl}" target="_blank" rel="noopener">Get a key ›</a></p>
    <div class="field"><label for="apikey">${esc(PROVIDERS[curProv()].name)} API key</label><input id="apikey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${curKey() ? '•••• saved ••••' + esc(curKey().slice(-4)) : esc(PROVIDERS[curProv()].hint)}"></div>
    <div class="field"><label for="aimodel">Model</label><input id="aimodel" type="text" list="modelList" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(aiCfg().models[curProv()] || PROVIDERS[curProv()].def)}" placeholder="Tap Find free models"><datalist id="modelList"></datalist>
      <div id="modelPick" class="chips"></div></div>
    <div class="row-btns"><button class="btn sec" id="findModels">Find ${PROVIDERS[curProv()].free ? 'free ' : ''}models</button><button class="btn" id="saveKey">Save & test</button></div>
    ${curKey() ? '<button class="linkbtn" id="clrKey" style="justify-self:start">Remove this key</button>' : ''}
    <p class="small" id="aiTest" aria-live="polite" style="margin:0"></p>
    <p class="small muted" style="margin:0">Keys stay on this phone and go only to the provider you choose. ${PROVIDERS[curProv()].free ? 'Free tiers have daily limits and the provider may use questions to improve its service: never enter patient-identifiable information.' : 'Usage is billed to the key’s account.'} Without AI, Ask still answers from the lessons, offline.</p>
  </div>
  <h2 class="sh">Progress</h2>
  <div class="card stack">
    <p style="margin:0" class="small">${Object.keys(S.read).length} lessons read · ${Object.keys(S.srs).length} questions attempted · ${S.mocks.length} mock assessments</p>
    ${confirmWipe ? `<p style="margin:0"><b>Reset everything?</b> Lessons, review schedule, mock scores and audit ratings will be cleared.</p><div class="row-btns"><button class="btn ghost" id="wNo">Cancel</button><button class="btn" style="background:var(--bad);color:var(--surface)" id="wYes">Reset</button></div>` : `<button class="btn ghost block" id="wipe">Reset all progress</button>`}
  </div>`,
  after(v) {
    $$('[data-fs]', v).forEach(b => b.onclick = () => { S.fs = +b.dataset.fs; save(); applyFs(); render(); });
    const cfg = aiCfg(), out = $('#aiTest');
    $$('[data-prov]', v).forEach(b => b.onclick = () => { cfg.provider = b.dataset.prov; save(); render(); });
    const keyNow = () => $('#apikey').value.trim() || curKey();
    $('#findModels').onclick = async () => {
      const k = keyNow(); if (!k && curProv() !== 'openrouter') { out.textContent = 'Paste your key first.'; return; }
      out.textContent = 'Looking up models…';
      try {
        const ids = await listModels(curProv(), k);
        if (!ids.length) { out.textContent = 'No models found for this key.'; return; }
        $('#modelList').innerHTML = ids.map(i => `<option value="${esc(i)}">`).join('');
        $('#modelPick').innerHTML = ids.slice(0, 12).map(i => `<button class="chip" data-m="${esc(i)}">${esc(i)}</button>`).join('');
        $$('[data-m]', v).forEach(c => c.onclick = () => { $('#aimodel').value = c.dataset.m; $$('[data-m]', v).forEach(x => x.classList.toggle('done', x === c)); });
        out.textContent = ids.length + ' model' + (ids.length > 1 ? 's' : '') + ' found. Tap one, then Save & test.';
      } catch (e) { out.textContent = e.code === 'bad_key' ? 'The key was rejected.' : 'Could not reach the provider. Check your connection (this does not work inside the Claude preview).'; }
    };
    $('#saveKey').onclick = async () => {
      const k = keyNow(), m = $('#aimodel').value.trim();
      if (!k) { out.textContent = 'Paste your key first.'; return; }
      if (!m) { out.textContent = 'Choose a model first: tap Find free models.'; return; }
      cfg.keys[curProv()] = k; cfg.models[curProv()] = m; save();
      out.textContent = 'Testing…';
      try {
        await providerChat(curProv(), k, m, [{ role: 'user', content: 'Reference notes:\n[1] (Lesson: Skin-to-skin) Skin-to-skin within 5 minutes of birth, for at least 1 hour.\n\nQuestion: In one short sentence, when should skin-to-skin start?' }], () => {}, undefined, 400);
        toast('AI connected'); render(); setTimeout(() => { const t = $('#aiTest'); if (t) t.innerHTML = '<span class="pill good">Connected · test answer received</span>'; }, 30);
      } catch (e) { out.textContent = 'Saved, but the test failed: ' + (AI_ERR[e.code] || 'the provider did not answer.') + (e.message ? ' (' + String(e.message).slice(0, 140) + ')' : ''); }
    };
    const ck = $('#clrKey'); if (ck) ck.onclick = () => { delete cfg.keys[curProv()]; save(); toast('Key removed'); render(); };
    const w = $('#wipe'); if (w) w.onclick = () => { confirmWipe = true; render(); };
    const n = $('#wNo'); if (n) n.onclick = () => { confirmWipe = false; render(); };
    const y = $('#wYes'); if (y) y.onclick = () => { S = Object.assign(JSON.parse(JSON.stringify(DEF)), { fs: S.fs, noInstall: S.noInstall }); confirmWipe = false; save(); toast('Progress reset'); render(); };
  } });
VIEWS.about = () => {
  const off = 'serviceWorker' in navigator && navigator.serviceWorker.controller;
  return { title: 'About', backLabel: 'Tools', html: `
  <div class="brand" style="margin-top:12px"><img src="icons/icon-192.png" alt="BFHI Learn logo" width="64" height="64"><h1 class="lt" style="margin:0">About</h1></div>
  <div class="card stack">
    <p style="margin:0"><span class="pill ${off ? 'good' : 'warn'}">${off ? 'Available offline' : 'Offline mode not active here'}</span></p>
    <p style="margin:0">BFHI Learn is a self-study companion for staff preparing for Baby-friendly Hospital Initiative (Hospital Rakan Bayi) assessment, including NICU and SCN teams.</p>
    <p style="margin:0" class="small muted">Progress is stored only on this device. No data leaves your phone.</p>
  </div>

    <li>${ICON.check}<span>WHO & UNICEF. Implementation guidance: protecting, promoting and supporting breastfeeding in facilities providing maternity and newborn services — the revised Baby-friendly Hospital Initiative. 2018.</span></li>
    <li>${ICON.check}<span>WHO & UNICEF. Acceptable medical reasons for use of breast-milk substitutes. 2009.</span></li>
    <li>${ICON.check}<span>WHO. International Code of Marketing of Breast-milk Substitutes. 1981, and subsequent WHA resolutions.</span></li>
    <li>${ICON.check}<span>Nyqvist KH, et al. Neo-BFHI: The Baby-friendly Hospital Initiative for Neonatal Wards. Core document. 2015.</span></li>
    <li>${ICON.check}<span>Kementerian Kesihatan Malaysia. Manual Pembimbing Penyusuan Susu Ibu. 2019.</span></li>
    <li>${ICON.check}<span>Jabatan Kesihatan Negeri Sarawak, Cawangan Pemakanan. Penyusuan Susu Ibu Pilihan Terbaik Anda (booklet).</span></li>
    <li>${ICON.check}<span>National Lactation Centre, KKM. Infographics on positioning and attachment.</span></li>
  </ul></div>
  <p class="muted small" style="margin:14px 4px">For education only. Follow your hospital policy and national guidelines for clinical decisions.</p>`, after() {} };
};

/* ---------- boot ---------- */
function applyFs() { document.documentElement.style.fontSize = (16 * (S.fs || 1)) + 'px'; }
$$('.tab').forEach(b => { const t = b.dataset.tab; b.innerHTML = ICON[t] + `<span>${{ home: 'Home', learn: 'Learn', ask: 'Ask', practice: 'Practice', tools: 'Tools' }[t]}</span>`; b.onclick = () => switchTab(t); });
applyFs();
const h = (location.hash || '').slice(1);
if (stacks[h]) tab = h;
render();
if ('serviceWorker' in navigator && topLevel && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
}
})();
</script>
